<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJS Sports App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a school sports meet's official scorer's desk — confident, quick, legible from the back row
   IDEA: the running track itself; every house is a lane, points are distance run
   PICTURE: clay track band with white lane lines, house-colour bars racing to their totals
   COLOUR and TYPE: track clay #a63a23 dominant, white lane lines, the houses' own colours as accents; Barlow Condensed numerals + Barlow
   LAYOUT: clay sidebar like the track edge, working screens open straight onto the task, stacks to one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ee,#111214);--card:light-dark(#fff,#1a1c1f);--ink:light-dark(#17191d,#ecebe7);--mut:light-dark(#5d6168,#a2a5ab);--line:light-dark(#e1ddd5,#2d3035);--soft:light-dark(#f8f6f2,#16181b);--clay:#a63a23;--clay2:#8a2e1b;--focus:light-dark(#1f5fbf,#7fb0ff);--disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,'Segoe UI',system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--clay2);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 24px;background-image:repeating-linear-gradient(90deg,transparent 0 54px,rgba(255,255,255,.07) 54px 56px)}
.brand{font:800 28px/1 var(--disp);padding:4px 10px}
.brand small{display:block;font:500 13px/1.35 Barlow,sans-serif;opacity:.85;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:600;font-size:15px;min-height:42px;display:flex;align-items:center;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{background:#fff;color:var(--clay2)}
.nav .grp{font-size:13px;opacity:.75;padding:14px 12px 4px}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.top .sess{display:flex;align-items:center;gap:8px;font-weight:600}
.top .state{margin-left:auto;font-size:13px;color:var(--mut)}
main{padding:20px max(3vw,16px) 60px;max-width:1320px}
h1,h2,h3{font-family:var(--disp);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:32px;margin-bottom:4px}
h3{font-size:22px;margin-bottom:10px}
.lead{color:var(--mut);margin:0 0 18px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stackv>*+*{margin-top:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>label{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
label>input,label>select,label>textarea{margin-top:4px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=color]{padding:3px;width:56px;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--clay);vertical-align:middle}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;font-weight:500;min-height:44px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:600 15px/1 Barlow,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.pri:hover{background:var(--clay2)}
.btn.danger{color:#c0392b;border-color:color-mix(in srgb,#c0392b 40%,transparent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.x{border:0;background:transparent;color:var(--mut);font-size:22px;width:44px;height:44px;border-radius:10px;cursor:pointer}
.x:hover{background:var(--soft);color:#c0392b}
.mut{color:var(--mut)}
.tiny{font-size:13px;color:var(--mut)}
.hchip{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px #0002}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:#1f9a5222;border-color:#1f9a5255;color:light-dark(#156b39,#7fdca6)}
.tag.rec{background:#e4002b1c;border-color:#e4002b55;color:light-dark(#b0001f,#ff8aa0)}
.empty{padding:28px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{text-align:left;font-size:13px;color:var(--mut);font-weight:700;padding:8px;border-bottom:2px solid var(--line)}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t input,.t select{min-height:40px;padding:6px 9px}
.scroll{overflow-x:auto}
.banner{background:color-mix(in srgb,var(--clay) 12%,var(--card));border:1px solid color-mix(in srgb,var(--clay) 35%,transparent);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
/* hero track */
.hero{background:var(--clay);color:#fff;border-radius:18px;padding:22px clamp(16px,3vw,32px) 10px;background-image:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.05) 120px 122px)}
.hero .kick{font-weight:600;opacity:.9;font-size:15px}
.hero h1{font-size:clamp(34px,5vw,52px);font-weight:800;margin:2px 0 6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:15px}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;width:min(320px,100%)}
.prog span{display:block;height:100%;background:#fff;border-radius:9px}
.lanes{margin-top:16px}
.lane{display:grid;grid-template-columns:44px 130px minmax(0,1fr) 96px;align-items:center;gap:12px;border-top:2px solid rgba(255,255,255,.6);padding:10px 0;min-height:66px}
.lane:last-child{border-bottom:2px solid rgba(255,255,255,.6)}
.lane .rk{font:800 34px/1 var(--disp);opacity:.9;text-align:center}
.lane .nm{font:700 22px/1.1 var(--disp)}
.lane .nm small{display:block;font:500 13px Barlow,sans-serif;opacity:.85}
.lane .bar{height:26px;position:relative}
.lane .bar span{position:absolute;left:0;top:0;bottom:0;border-radius:0 14px 14px 0;box-shadow:0 0 0 2px #fff;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lane .pts{font:800 44px/1 var(--disp);text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.lane .bar span{transition:none}}
.pod{display:flex;gap:14px;align-items:center}
.medal{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:800 26px var(--disp);color:#2a1a00;box-shadow:inset 0 -4px 0 #0002}
.m1{background:#f3c64b}.m2{background:#cfd4da}.m3{background:#d99a5f}.mx{background:var(--soft);color:var(--ink)}
.lbl{font-size:13px;font-weight:700;color:var(--mut)}
.big{font:700 24px/1.15 var(--disp);margin:2px 0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi b{display:block;font:800 36px/1 var(--disp)}
.feed li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.feed{list-style:none;margin:0;padding:0}
/* results */
.rlayout{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:16px;align-items:start}
.evlist{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.evi{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;gap:8px;justify-content:space-between;align-items:center;min-height:52px}
.evi:hover{border-color:var(--mut)}
.evi.on{border-color:var(--clay);box-shadow:0 0 0 2px var(--clay) inset}
.evi:focus-visible{outline:3px solid var(--focus)}
.evi .e1{font-weight:700}.evi .e2{font-size:13px;color:var(--mut)}
.rrow{display:grid;grid-template-columns:62px 128px minmax(0,1fr) 96px 58px 40px;gap:8px;align-items:center;margin-bottom:8px}
.rrow.nop{grid-template-columns:62px 128px minmax(0,1fr) 58px 40px}
.ptag{font:700 18px var(--disp);text-align:right;white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.filters .q{grid-column:1/-1}
/* houses */
.hcard{border-radius:14px;border:1px solid var(--line);background:var(--card);overflow:hidden}
.hcard .hh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font:800 26px var(--disp)}
.hcard .hb{padding:14px 16px;display:grid;gap:10px}
/* scoreboard */
.sb{background:#141414;color:#fff;border-radius:18px;padding:clamp(16px,3vw,34px);min-height:80vh}
.sb .hero{border-radius:14px}
.sb .lane{min-height:clamp(70px,11vh,120px)}
.sb .lane .pts{font-size:clamp(44px,7vw,92px)}
.sb .lane .nm{font-size:clamp(22px,3vw,38px)}
.sb .lane{grid-template-columns:clamp(40px,5vw,70px) clamp(110px,16vw,230px) minmax(0,1fr) clamp(90px,12vw,190px)}
.sb .lane .bar{height:clamp(24px,4vh,40px)}
.sb table.t td,.sb table.t th{border-color:#333;color:#fff}
.sb .tick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:16px}
.sb .tick div{background:#222;border-radius:12px;padding:12px 14px}
:fullscreen .sb{border-radius:0;min-height:100vh}
/* paper */
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 2px 18px #0002;padding:28px;max-width:900px;margin-top:16px;overflow-x:auto}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#17191d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:50;max-width:92vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:60;padding:16px}
.modal.on{display:grid}
.modal .card{max-width:440px;width:100%}
@media(max-width:1000px){.g3{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rlayout{grid-template-columns:minmax(0,1fr)}.evlist{max-height:42vh}}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;padding:12px}.nav{flex-direction:row;overflow-x:auto;margin-top:10px;padding-bottom:4px}.nav .grp{display:none}.nav a{flex:none}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){h2{font-size:28px}.lane{grid-template-columns:30px minmax(0,1fr) 70px;gap:8px}.lane .bar{grid-column:2/4;grid-row:2;height:16px}.lane .pts{font-size:34px}.lane .rk{font-size:26px}
 .sb .lane{grid-template-columns:34px minmax(0,1fr) 84px}
 .rrow,.rrow.nop{grid-template-columns:56px minmax(0,1fr) 80px 40px;padding-bottom:8px;border-bottom:1px solid var(--line)}.rrow select{grid-column:2/4;grid-row:1}.rrow .x{grid-column:4;grid-row:1}.rrow input[data-k=name]{grid-column:1/3;grid-row:2}.rrow.nop input[data-k=name]{grid-column:1/4}.rrow input[data-k=perf]{grid-column:3;grid-row:2}.rrow .ptag{grid-column:4;grid-row:2;font-size:15px}
 .top{position:static}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}.stack td.n{text-align:start}}
@media print{.side,.top,.noprint,.toast,.modal{display:none!important}.app{display:block}main{padding:0;max-width:none}.paper{box-shadow:none;padding:0;margin:0;max-width:none;border-radius:0}body{background:#fff}}
</style>
<style id="pcss"></style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand">SJS Sports App<small id="schoolName">St. James H.S. School</small></div>
  <nav class="nav" id="nav">
   <div class="grp">Meet day</div>
   <a href="#home">Dashboard</a>
   <a href="#results">Enter results</a>
   <a href="#scoreboard">Live scoreboard</a>
   <a href="#champions">Champions</a>
   <a href="#records">Meet records</a>
   <a href="#reports">Reports &amp; certificates</a>
   <div class="grp">Set up</div>
   <a href="#events">Events / items</a>
   <a href="#athletes">Athletes</a>
   <a href="#houses">Houses</a>
   <a href="#categories">Categories</a>
   <a href="#points">Points rules</a>
   <a href="#bonus">Special points</a>
   <div class="grp">Manage</div>
   <a href="#sessions">Sessions &amp; backup</a>
   <a href="#setup">School details</a>
  </nav>
 </aside>
 <div>
  <header class="top">
   <div class="sess"><label for="sessSel" style="color:inherit;font-size:15px">Session</label><select id="sessSel" style="width:auto;min-width:150px"></select></div>
   <span class="state" id="saveState">Saved on this device</span>
  </header>
  <main id="main"></main>
 </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card"><h3 id="mTitle">Are you sure?</h3><p id="mText" class="mut"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">Cancel</button><button class="btn pri" id="mYes">Yes, continue</button></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
{
const $=s=>document.querySelector(s);
const main=$('#main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const POSW=['','First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth'];
const RANKL=['Champion House','Runner-up','2nd Runner-up'];
const KEY='sjs_sports_app_v1';
const PCSS=`.p-doc{font-family:Barlow,'Segoe UI',Arial,sans-serif;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-head{text-align:center;border-bottom:3px double #333;padding-bottom:8px;margin-bottom:14px}
.p-head h1{margin:0;font:800 26px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.02em}
.p-head .m{font-style:italic;font-size:13px}.p-head .a{font-size:12px}
.p-head h2{margin:8px 0 0;font:700 19px/1.2 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.p-doc h3{font:700 16px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
.p-doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px;page-break-inside:auto}
.p-doc tr{page-break-inside:avoid}
.p-doc th,.p-doc td{border:1px solid #888;padding:4px 6px;text-align:left}
.p-doc th{background:#eee}
.p-doc .n{text-align:right}
.p-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid #0004}
.p-sign{display:flex;justify-content:space-between;margin-top:46px;font-size:13px;gap:20px}
.p-sign div{border-top:1px solid #333;padding-top:4px;min-width:170px;text-align:center}
.p-foot{font-size:11px;color:#555;margin-top:10px}
.cert{border:10px double #a63a23;padding:26px 40px;text-align:center;page-break-after:always;break-after:page;min-height:178mm;display:flex;flex-direction:column;justify-content:center;margin-bottom:18px}
.cert .sch{font:800 30px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.cert .ct{font:800 44px/1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#a63a23;letter-spacing:.04em;margin:18px 0 10px}
.cert .nm{font:700 34px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;border-bottom:1px dotted #333;display:inline-block;padding:0 28px;margin:6px auto}
.cert p{font-size:17px;line-height:1.7;margin:6px 0}
.cert .hb{display:inline-block;padding:1px 12px;border-radius:20px;font-weight:700}`;
$('#pcss').textContent=PCSS.replace(/\.p-doc\{/,'.p-doc{');

/* ---------- storage ---------- */
let canStore=true;
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){canStore=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));canStore=true}catch(e){canStore=false}stamp()}
function stamp(){$('#saveState').textContent=canStore?'Saved on this device · works offline':'This browser is not keeping data — download a backup often'}

/* ---------- defaults ---------- */
function baseSession(year){
 return {id:uid(),year,title:'Annual Sports Meet',date:'',venue:'School Playground',created:Date.now(),
  houses:[['David','#1f5fbf'],['Moses','#d23a2f'],['Joseph','#1f9a52'],['Daniel','#f2c12e']].map(([name,color])=>({id:uid(),name,color,captain:'',vice:'',master:''})),
  cats:[['Minor','Nursery – Class II'],['Sub-Junior','Class III – V'],['Junior','Class VI – VIII'],['Senior','Class IX – XII']].map(([name,desc])=>({id:uid(),name,desc})),
  types:[['Individual',[5,3,1],true,false],['Relay',[10,6,4],false,true],['Major Game',[15,10,5],false,true],['Minor / Fun',[3,2,1],true,false]].map(([name,pts,indiv,team])=>({id:uid(),name,pts,indiv,team})),
  events:[],athletes:[],results:{},bonus:[]};
}
function blankRec(){return{val:'',holder:'',house:'',year:''}}
function stdEvents(s){
 const cid=n=>(s.cats.find(c=>c.name===n)||{}).id||'';
 const tid=n=>(s.types.find(t=>t.name===n)||s.types[0]).id;
 const L={'Minor':[['50m Race','Individual','time'],['Frog Race','Minor / Fun','none'],['Lemon & Spoon Race','Minor / Fun','none']],
  'Sub-Junior':[['100m Race','Individual','time'],['Long Jump','Individual','dist'],['Sack Race','Minor / Fun','none'],['4x50m Relay','Relay','time']],
  'Junior':[['100m Race','Individual','time'],['200m Race','Individual','time'],['Long Jump','Individual','dist'],['High Jump','Individual','dist'],['Shot Put','Individual','dist'],['4x100m Relay','Relay','time']],
  'Senior':[['100m Race','Individual','time'],['200m Race','Individual','time'],['400m Race','Individual','time'],['800m Race','Individual','time'],['Long Jump','Individual','dist'],['High Jump','Individual','dist'],['Shot Put','Individual','dist'],['Discus Throw','Individual','dist'],['Javelin Throw','Individual','dist'],['4x100m Relay','Relay','time']]};
 for(const [cn,list] of Object.entries(L))for(const g of ['Boys','Girls'])for(const [name,tn,measure] of list)s.events.push({id:uid(),name,catId:cid(cn),gender:g,typeId:tid(tn),measure,rec:blankRec()});
 [['Football','Boys'],['Volleyball','Girls'],['Tug of War','Boys'],['Tug of War','Girls']].forEach(([name,g])=>s.events.push({id:uid(),name,catId:'',gender:g,typeId:tid('Major Game'),measure:'none',rec:blankRec()}));
}
function demo(s){
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const BF=['Lalremruata','Vanlalhriata','Zothanmawia','Lalrinfela','Malsawmtluanga','Lalthlamuana','Rohmingthanga','Lalbiakzuala','Vanlalruata','Lalnunsanga','Samuel','Joseph','Lalhruaitluanga','Zoramsanga','Lalmuanpuia','Ramdinthara'];
 const GF=['Lalrinpuii','Zothanpuii','Vanlalhruaii','Lalremsiami','Malsawmkimi','Lalthlamuani','Rosangpuii','Lalnunmawii','Esther','Lalhmingsangi','Ruth','Zonunsiami','Lalchhanhimi','Vanlalrinchhani','Lalruatfeli','Laldinpuii'];
 const SUR=['Ralte','Darlong','Sailo','Pachuau','Khiangte','Hmar','Chhangte','Fanai'];
 const CLS=[['I','II'],['IV','V'],['VII','VIII'],['X','XI']];
 let bi=0,gi=0;
 s.cats.forEach((c,ci)=>s.houses.forEach(h=>['B','G'].forEach(g=>{for(let k=0;k<2;k++){const i=g==='B'?bi++:gi++;const f=(g==='B'?BF:GF)[i%16];s.athletes.push({id:uid(),name:f+' '+SUR[(i+Math.floor(i/16)*3)%8],cls:(CLS[ci]||['',''])[k],gender:g,houseId:h.id,catId:c.id,chest:String(101+s.athletes.length)})}})));
 const base=n=>{n=n.toLowerCase();return /4x50/.test(n)?36:/4x100/.test(n)?60:/800m/.test(n)?165:/400m/.test(n)?68:/200m/.test(n)?29:/100m/.test(n)?13.8:/50m/.test(n)?8.6:/long/.test(n)?4.1:/high/.test(n)?1.28:/shot/.test(n)?7.6:/discus/.test(n)?21:/javelin/.test(n)?25:0};
 const cf=[1.25,1.15,1.06,1];
 const N=s.events.length;let at=Date.now()-N*90000;
 s.events.forEach((e,ei)=>{
  const t=s.types.find(x=>x.id===e.typeId);const ci=s.cats.findIndex(c=>c.id===e.catId);
  const b=base(e.name),gf=e.gender==='Girls'?1.1:1,f=ci<0?1:cf[ci];
  const mk=()=>e.measure==='time'?b*f*gf:b/f/(gf===1?1:1.18);
  if(b&&rnd()<.55)e.rec={val:fmtPerf(e.measure==='time'?mk()*0.985:mk()*1.02,e.measure),holder:'Previous record',house:s.houses[Math.floor(rnd()*4)].name,year:'2025-26'};
  if(rnd()>.62)return;
  let rows;
  if(t&&t.team){rows=shuf(s.houses).slice(0,t.pts.length).map((h,i)=>({pos:i+1,houseId:h.id,name:'',athId:'',perf:''}))}
  else{const g=e.gender==='Boys'?'B':'G';const pool=shuf(s.athletes.filter(a=>a.catId===e.catId&&a.gender===g)).slice(0,(t?t.pts.length:3));
   let ps=pool.map(()=>mk()*(1+rnd()*.1-.03));ps.sort((a,b)=>e.measure==='dist'?b-a:a-b);
   rows=pool.map((a,i)=>({pos:i+1,houseId:a.houseId,name:a.name,athId:a.id,perf:e.measure==='none'?'':fmtPerf(ps[i],e.measure)}))}
  if(t&&t.team&&e.measure==='time'){let ps=rows.map(()=>mk()*(1+rnd()*.08));ps.sort((a,b)=>a-b);rows.forEach((r,i)=>r.perf=fmtPerf(ps[i],'time'))}
  s.results[e.id]={rows,at:at+=90000};
 });
 const hs=s.houses;s.bonus=[{id:uid(),houseId:hs[2].id,pts:10,reason:'March Past – 1st'},{id:uid(),houseId:hs[0].id,pts:7,reason:'March Past – 2nd'},{id:uid(),houseId:hs[3].id,pts:5,reason:'March Past – 3rd'},{id:uid(),houseId:hs[1].id,pts:-2,reason:'Discipline penalty'}];
 s.demo=true;
}

/* ---------- performance ---------- */
function parsePerf(v){v=String(v||'').trim().replace(/[a-z\s]+$/i,'');if(!v)return NaN;if(v.includes(':')){const [m,sec]=v.split(':');return (+m)*60+(+sec)}return parseFloat(v)}
function fmtPerf(x,m){if(m==='time'){if(x>=60){const mm=Math.floor(x/60),ss=(x-mm*60).toFixed(2).padStart(5,'0');return mm+':'+ss}return x.toFixed(2)}return x.toFixed(2)}
const unitOf=m=>m==='time'?'s':m==='dist'?'m':'';
const better=(a,b,m)=>m==='time'?a<b:a>b;

const txtOn=c=>{c=(c||'#888888').replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)>160?'#17191d':'#fff'};
const chip=(h,t)=>h?`<span class="hchip" style="background:${h.color};color:${txtOn(h.color)}">${esc(t??h.name)}</span>`:'<span class="mut">—</span>';

const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})};
const genderOf=g=>g==='B'?'Boy':g==='G'?'Girl':'—';
const cmpI=(a,b)=>b.pts-a.pts||b.g-a.g||b.s-a.s||b.b-a.b||a.name.localeCompare(b.name);
const best=list=>{const l=list.slice().sort(cmpI);if(!l.length||!l[0].pts)return[];return l.filter(x=>x.pts===l[0].pts&&x.g===l[0].g&&x.s===l[0].s&&x.b===l[0].b)};
function catKeys(s=S()){const k=s.cats.map(c=>c.id);if(s.events.some(e=>!e.catId))k.push('_open');return k}

/* ---------- the scoring engine ---------- */
function calc(s=S()){
 const M={};s.houses.forEach(h=>M[h.id]={h,total:0,g:0,si:0,b:0,cat:{},type:{},bonus:0,ev:0});
 let done=0,awarded=0;const recs=[],feed=[],cats={},all={};
 const add=(m,key,o0,p,pos,e)=>{const o=m[key]||(m[key]={...o0,pts:0,g:0,s:0,b:0,ev:[]});o.pts+=p;if(pos==1)o.g++;else if(pos==2)o.s++;else if(pos==3)o.b++;o.ev.push(e.name+(e.catId?'':' (Open)')+' – '+ord(pos))};
 s.events.forEach(e=>{
  const r=s.results[e.id];if(!r||!r.rows||!r.rows.length)return;
  const t=Ts(e.typeId,s)||{pts:[],indiv:false,team:false};done++;feed.push({e,r});
  r.rows.forEach(row=>{
   const p=+t.pts[row.pos-1]||0;const x=M[row.houseId];if(!x)return;
   x.total+=p;awarded+=p;x.ev+=p?1:0;if(row.pos==1)x.g++;else if(row.pos==2)x.si++;else if(row.pos==3)x.b++;
   const ck=e.catId||'_open';x.cat[ck]=(x.cat[ck]||0)+p;x.type[t.id]=(x.type[t.id]||0)+p;
   if(t.indiv&&!t.team&&row.name&&String(row.name).trim()){
    const a=row.athId&&s.athletes.find(z=>z.id===row.athId);
    const gender=a&&a.gender?a.gender:(e.gender==='Boys'?'B':e.gender==='Girls'?'G':'');
    const key=a?a.id:norm(row.name)+'|'+row.houseId;
    const o0={key,name:a?a.name:String(row.name).trim(),houseId:a?a.houseId:row.houseId,gender,cls:a?a.cls:''};
    add(cats[ck]||(cats[ck]={}),key,o0,p,row.pos,e);add(all,key,o0,p,row.pos,e);
   }
  });
  if(e.measure!=='none'){const w=r.rows.filter(x=>x.pos==1&&!isNaN(parsePerf(x.perf)))[0];
   if(w){const v=parsePerf(w.perf),rv=parsePerf(e.rec&&e.rec.val);if(isNaN(rv)||better(v,rv,e.measure))recs.push({e,row:w,v,old:e.rec,isNew:!isNaN(rv)||!(e.rec&&e.rec.val)})}}
 });
 s.bonus.forEach(b=>{const x=M[b.houseId];if(x){const v=+b.pts||0;x.total+=v;x.bonus+=v}});
 const st=Object.values(M).sort((a,b)=>b.total-a.total||b.g-a.g||b.si-a.si||b.b-a.b);
 st.forEach((x,i)=>{const p=st[i-1];x.rank=p&&p.total===x.total&&p.g===x.g&&p.si===x.si&&p.b===x.b?p.rank:i+1});
 feed.sort((a,b)=>(b.r.at||0)-(a.r.at||0));
 return{M,st,done,total:s.events.length,awarded,recs,feed,cats,all};
}

   const ev=`<b>${esc(e.name)}</b> (${esc(catName(e.catId))}, ${esc(e.gender)})${x.perf?` with ${esc(x.perf)} ${unitOf(e.measure)}`:''}`;
   if(t.team||!x.name)out.push(cert(esc(h?h.name+' House':''),`secured the <b>${POSW[x.pos]||ord(x.pos)} position</b> in ${ev}`));

  return`<div class="p-doc">${out.join('')||'<p>No winners yet — certificates appear once results are saved.</p>'}</div>`}

 rep:el=>{ui.report=el.dataset.id;rerender()},
 printRep:()=>{const st=document.createElement('style');st.textContent=ui.report==='certs'?'@page{size:A4 landscape;margin:8mm}':'@page{size:A4;margin:12mm}';document.head.appendChild(st);try{window.print()}catch(e){toast('Printing is blocked here — use Download')}setTimeout(()=>st.remove(),1500)},
 dlRep:()=>{const s=S();const land=ui.report==='certs';const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(REPS[ui.report])} ${esc(s.year)}</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;700&display=swap" rel="stylesheet"><style>${PCSS}body{margin:16px;background:#fff}@page{size:A4 ${land?'landscape':'portrait'};margin:${land?8:12}mm}.np{font:600 15px sans-serif;padding:10px 18px;margin-bottom:14px;cursor:pointer}@media print{.np{display:none}body{margin:0}}</style></head><body><button class="np" onclick="print()">Print</button>${repHTML(ui.report,ui.repCat)}</body></html>`;saveFile(`SJS_${REPS[ui.report].replace(/\W+/g,'_')}_${s.year}.html`,html)},
 csv:()=>{const s=S();const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const L=[['Session','Event','Category','Gender','Rule','Position','House','Name','Class','Performance','Points'].join(',')];
  s.events.forEach(e=>{const t=Ts(e.typeId)||{pts:[]};(s.results[e.id]?.rows||[]).forEach(r=>{const a=r.athId&&s.athletes.find(z=>z.id===r.athId);L.push([s.year,e.name,catName(e.catId),e.gender,t.name,r.pos,(Hs(r.houseId)||{}).name,r.name,a?a.cls:'',r.perf,+t.pts[r.pos-1]||0].map(q).join(','))})});
  saveFile(`SJS_Sports_Results_${s.year}.csv`,'﻿'+L.join('\r\n'))},
 newSess:()=>{const cur=S();const year=val('nsYear');if(!year){toast('Type the session, e.g. 2027-28');return}
  const n={id:uid(),year,title:val('nsTitle')||cur.title,date:val('nsDate'),venue:cur.venue,created:Date.now(),houses:clone(cur.houses),cats:clone(cur.cats),types:clone(cur.types),events:[],athletes:chk('nsAth')?clone(cur.athletes):[],results:{},bonus:[]};
  if(chk('nsEv')){n.events=clone(cur.events);if(chk('nsRec')){const c=calc(cur);c.recs.forEach(r=>{const e=n.events.find(x=>x.id===r.e.id);if(e)e.rec={val:r.row.perf,holder:r.row.name||((Hs(r.row.houseId,cur)||{}).name+' House'),house:(Hs(r.row.houseId,cur)||{}).name||'',year:cur.year}})}}
  DB.sessions[n.id]=n;DB.active=n.id;ui.sel=null;ui.draft=null;save();location.hash='#home';render();toast(`Session ${year} started`)},
 openSess:el=>{DB.active=el.dataset.id;ui.sel=null;ui.draft=null;save();rerender();toast('Opened '+S().year)},
 delSess:async el=>{const id=el.dataset.id;if(Object.keys(DB.sessions).length<2){toast('This is the only session');return}const s=DB.sessions[id];if(!await ask(`Delete session ${s.year}?`,'All its results will be lost. Download a backup first if unsure.','Delete session'))return;delete DB.sessions[id];if(DB.active===id)DB.active=Object.keys(DB.sessions)[0];save();rerender()},
 backup:()=>{const d=new Date();saveFile(`SJS_Sports_Backup_${S().year}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`,JSON.stringify(DB))},
 copyBackup:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(DB));toast('Backup copied — paste it into a note or email')}catch(e){const t=$('#pasteTxt');t.value=JSON.stringify(DB);t.select();toast('Select-all and copy the text in the box')}},
 restoreFile:()=>$('#fileIn').click(),
 restorePaste:()=>restore(val('pasteTxt')),
 clearDemo:async()=>{if(!await ask('Clear demo data?','Sample athletes, results, special points and demo records will be removed. Houses, categories, rules and events stay.','Clear demo'))return;const s=S();s.athletes=[];s.results={};s.bonus=[];s.events.forEach(e=>e.rec=blankRec());delete s.demo;save();rerender();toast('Demo data cleared — ready for your meet')},
 clearResults:async()=>{if(!await ask('Clear all results?','Every place and special point of this session will be removed.','Clear results'))return;const s=S();s.results={};s.bonus=[];delete s.demo;save();rerender()},
 resetAll:async()=>{if(!await ask('Erase everything?','All sessions and data on this device will be deleted. Download a backup first.','Erase all'))return;DB=freshDB(false);save();location.hash='#home';render()},
 fs:()=>{const el=$('#sbx');try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen().catch(()=>toast('Full screen is not allowed here — open the offline app'))}catch(e){toast('Full screen is not allowed here')}}
};
async function restore(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('That is not a valid backup');return}
 if(!d||!d.sessions||!d.active||!d.sessions[d.active]){toast('That is not an SJS Sports App backup');return}
 if(!await ask('Restore this backup?',`It has ${Object.keys(d.sessions).length} session(s). Data now on this device will be replaced.`,'Restore'))return;
 DB=d;DB.app=DB.app||freshDB(false).app;save();location.hash='#home';render();toast('Backup restored')}

main.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el)}});
main.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.r!=null&&ui.draft){const r=ui.draft.rows[+el.dataset.r];if(r){r[el.dataset.k]=el.value;if(el.dataset.k==='pos')paintRow(el.closest('.rrow'),r,S().events.find(x=>x.id===ui.sel))}return}
 if(el.dataset.uf==='q'){ui.evf.q=el.value;$('#evList').innerHTML=evListHTML();return}
 if(el.dataset.af==='q'){ui.af.q=el.value;clearTimeout(ui.at);ui.at=setTimeout(()=>{rerender();const q=main.querySelector('[data-af=q]');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},350)}
});
main.addEventListener('change',e=>{const el=e.target,s=S();
 if(el.dataset.r!=null&&ui.draft){const i=+el.dataset.r,r=ui.draft.rows[i],k=el.dataset.k;if(!r)return;r[k]=el.value;const ev=s.events.find(x=>x.id===ui.sel);
  if(k==='name'){const a=matchAth(el.value,ev,r.houseId)||matchAth(el.value,ev);if(a){r.athId=a.id;r.houseId=a.houseId}else r.athId=''}
  if(k==='houseId'&&r.athId){const a=s.athletes.find(z=>z.id===r.athId);if(a&&a.houseId!==el.value)r.athId=''}
  paintRow(el.closest('.rrow'),r,ev);return}
 if(el.dataset.uf&&el.dataset.uf!=='q'){ui.evf[el.dataset.uf]=el.value;$('#evList').innerHTML=evListHTML();return}
 if(el.dataset.af&&el.dataset.af!=='q'){ui.af[el.dataset.af]=el.value;rerender();return}
 if(el.dataset.act2==='evCat'){ui.evCat=el.value;rerender();return}
 if(el.dataset.act2==='repCat'){ui.repCat=el.value;rerender();return}
 if(el.dataset.app){DB.app[el.dataset.app]=el.value;save();$('#schoolName').textContent=DB.app.school;return}
 if(el.dataset.ses){s[el.dataset.ses]=el.value;save();render();return}
 if(el.dataset.col){const it=s[el.dataset.col].find(x=>x.id===el.dataset.id);if(!it)return;let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.f==='pts'){v=String(v).split(/[,\s]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));if(!v.length){toast('Enter points like 5, 3, 1');rerender();return}}
  if(el.dataset.f==='name'&&!String(v).trim()){toast('Name cannot be empty');rerender();return}
  setPath(it,el.dataset.f,v);save();if(el.dataset.re)rerender()}
});
$('#sessSel').addEventListener('change',e=>{DB.active=e.target.value;ui.sel=null;ui.draft=null;save();render();toast('Opened '+S().year)});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);e.target.value=''});
window.addEventListener('hashchange',go);
window.addEventListener('storage',e=>{if(e.key===KEY){const d=load();if(d){DB=d;if(ui.page==='scoreboard'||ui.page==='home'||ui.page==='champions')rerender()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))$('#mNo').click()});
go();
}
</script>
</body>
