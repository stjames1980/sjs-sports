<style>
/* VOICE: a school sports meet's official scorer's desk (theme: turf green + blue athletics track) — confident, quick, legible from the back row
   IDEA: the running track itself; every house is a lane, points are distance run
   PICTURE: blue athletics track band with white lane lines, house-colour bars racing to their totals
   COLOUR and TYPE: turf green sidebar and buttons, blue track, faint sports-icon pattern, the houses' own colours as accents; Barlow Condensed + Barlow
   LAYOUT: turf sidebar like the field edge, working screens open straight onto the task, stacks to one column on phones */

052l5-5%22/%3E%3Cpath%20d=%22M120%20170l14%2034h-28z%22/%3E%3Ccircle%20cx=%22120%22%20cy=%22216%22%20r=%226%22/%3E%3Cpath%20d=%22M110%20188h20M113%20180h14%22/%3E%3Ccircle%20cx=%22236%22%20cy=%22200%22%20r=%2214%22/%3E%3Cpath%20d=%22M226%20186l-8-24h36l-8%2024%22/%3E%3Cpath%20d=%22M236%20194l2%205%205%20.5-4%203%201.5%205-4.5-3-4.5%203%201.5-5-4-3%205-.5z%22/%3E%3Cpath%20d=%22M30%20230c10-2%2022%204%2032%202l10%208H34z%22/%3E%3Cpath%20d=%22M40%20232l3-8M50%20233l3-8%22/%3E%3Cpath%20d=%22M150%2050c20%200%2036%2016%2036%2036M150%2066c12%200%2020%208%2020%2020%22/%3E%3C/g%3E%3C/svg%3E")}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22280%22%20height=%22280%22%20viewBox=%220%200%20280%20280%22%3E%3Cg%20fill=%22none%22%20stroke=%22%2311804e%22%20stroke-opacity=%22.09%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Ccircle%20cx=%2246%22%20cy=%2250%22%20r=%2222%22/%3E%3Cpath%20d=%22M46%2039l10%207-4%2012h-12l-4-12z%22/%3E%3Cpath%20d=%22M46%2028v11M66%2043l-10%203M60%2068l-8-10M32%2068l8-10M26%2043l10%203%22/%3E%3Ccircle%20cx=%22200%22%20cy=%2270%22%20r=%2220%22/%3E%3Cpath%20d=%22M200%2050v-8M194%2042h12M200%2070l9-8%22/%3E%3Cpath%20d=%22M214%2052l5-5%22/%3E%3Cpath%20d=%22M120%20170l14%2034h-28z%22/%3E%3Ccircle%20cx=%22120%22%20cy=%22216%22%20r=%226%22/%3E%3Cpath%20d=%22M110%20188h20M113%20180h14%22/%3E%3Ccircle%20cx=%22236%22%20cy=%22200%22%20r=%2214%22/%3E%3Cpath%20d=%22M226%20186l-8-24h36l-8%2024%22/%3E%3Cpath%20d=%22M236%20194l2%205%205%20.5-4%203%201.5%205-4.5-3-4.5%203%201.5-5-4-3%205-.5z%22/%3E%3Cpath%20d=%22M30%20230c10-2%2022%204%2032%202l10%208H34z%22/%3E%3Cpath%20d=%22M40%20232l3-8M50%20233l3-8%22/%3E%3Cpath%20d=%22M150%2050c20%200%2036%2016%2036%2036M150%2066c12%200%2020%208%2020%2020%22/%3E%3C/g%3E%3C/svg%3E") 0 0/280px;color:var(--ink);font:16px/1.5 Barlow,'Segoe UI',system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{background:var(--pri2);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 24px;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.055) 0 64px,transparent 64px 128px)}
.brand{font:800 28px/1 var(--disp);padding:4px 6px;display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;flex:none}.brand img:not([hidden])+div{font-size:20px;white-space:nowrap}.brand img:not([hidden])+div small{white-space:normal}
.brand small{display:block;font:500 13px/1.35 Barlow,sans-serif;opacity:.85;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.nav svg,.srch svg,.railbtn svg,.mbtn svg,.tsrch svg,.tabbar svg,.palin svg,.palres svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:10px;font-weight:600;font-size:14.5px;min-height:40px;display:flex;align-items:center;gap:11px;white-space:nowrap;position:relative}
.nav a .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav a svg{opacity:.85}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{background:#fff;color:var(--pri2)}.nav a.on svg{opacity:1}
.nav a.back{margin-top:12px;border:1px solid rgba(255,255,255,.35)}
.nav .grp{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.72;padding:14px 10px 5px;cursor:pointer;color:#fff}
.nav .grp:hover{opacity:1}.nav .grp:focus-visible{outline:2px solid #fff;border-radius:6px}
.nav .grp .gc{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 8px}
.nav .grp .chev{width:14px;height:14px;transition:transform .15s}.nav .grp[aria-expanded=false] .chev{transform:rotate(-90deg)}
.nav .gitems{display:flex;flex-direction:column;gap:1px}.nav .gitems[hidden]{display:none}
.nb{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 7px;background:rgba(255,255,255,.18);color:#fff;line-height:1.3}
.nav a.on .nb{background:var(--soft);color:var(--pri2)}
.nb.warn{background:#f5b301;color:#2a1d00}.nb.ok{background:transparent;color:#7ee2a8;padding:0 2px;font-size:15px}.nav a.on .nb.ok{color:var(--pri)}
.srch{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;font-size:14.5px}
.srch:hover{background:rgba(255,255,255,.2)}.srch:focus-visible{outline:2px solid #fff}.srch span{flex:1;opacity:.85}
.srch kbd{font:600 11px/1 Barlow,sans-serif;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:3px 5px;opacity:.8}
.railbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;margin-top:14px;padding:8px 10px;border-radius:10px;color:#fff;opacity:.7;cursor:pointer;font-size:14px}
.railbtn:hover{opacity:1;background:rgba(255,255,255,.1)}
.mbtn,.tsrch{display:none;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;flex:none}
.pgt{display:none;font:800 21px/1.1 var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar,.scrim{display:none}
/* collapsed (icon-only) menu on laptops */
@media(min-width:861px){
 .app.rail{grid-template-columns:72px minmax(0,1fr)}
 .app.rail .side{padding:14px 10px 20px}
 .app.rail .brand>div,.app.rail .nav .lb,.app.rail .nav .grp,.app.rail .srch span,.app.rail .srch kbd,.app.rail .railbtn span{display:none}
 .app.rail .brand{justify-content:center;padding:4px 0}
 .app.rail .nav a,.app.rail .srch,.app.rail .railbtn{justify-content:center;padding:9px 0}
 .app.rail .gitems[hidden]{display:flex}
 .app.rail .gitems{border-top:1px solid rgba(255,255,255,.18);padding-top:6px;margin-top:6px}
 .app.rail .nb{position:absolute;top:3px;right:3px;font-size:10px;padding:1px 5px}.app.rail .nb.ok{display:none}
 .app.rail .railbtn svg{transform:rotate(180deg)}
}

.cs{--cf:#173f8a;--cg:#b48a2c;position:relative;width:297mm;height:209.5mm;overflow:hidden;background:#fdfaf2;color:#211c17;font-family:SJSText,Georgia,serif;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
.cs:last-child{break-after:auto;page-break-after:auto}
.cs *{box-sizing:border-box}
.cs-f1{position:absolute;inset:7mm;border:1.6mm solid var(--cf);background:repeating-linear-gradient(45deg,var(--cg) 0 .28mm,transparent .28mm 1.3mm),#fdfaf2}
.cs-f2{position:absolute;inset:11mm;border:.35mm solid var(--cg);background:radial-gradient(ellipse at 50% 45%,#fffdf7 0,#fbf6ea 60%,#f6eedb 100%);overflow:hidden}
.cs-rose{position:absolute;width:150mm;height:150mm;left:50%;top:50%;transform:translate(-50%,-46%);opacity:.26}
.cs-c{position:absolute;width:20mm;height:20mm;display:block}.cs-c svg{width:100%;height:100%;display:block}
.cs-c.tl{left:12.5mm;top:12.5mm}.cs-c.tr{right:12.5mm;top:12.5mm;transform:scaleX(-1)}.cs-c.bl{left:12.5mm;bottom:12.5mm;transform:scaleY(-1)}.cs-c.br{right:12.5mm;bottom:12.5mm;transform:scale(-1,-1)}
.cs-rib{position:absolute;top:11mm;left:31mm;width:13mm;height:50mm;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);display:flex;justify-content:center;padding-top:4mm;box-shadow:0 0 0 .3mm #0002}
.cs-rib span{writing-mode:vertical-rl;transform:rotate(180deg);font:3.1mm/1 SJSCaps,Georgia,serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;max-height:40mm;overflow:hidden}
.cs-no{position:absolute;right:34mm;top:15.5mm;font:2.7mm/1 SJSCaps,Georgia,serif;letter-spacing:.12em;color:var(--cf)}
.cs-in{position:absolute;inset:15mm 30mm 15mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.cs-top{display:flex;flex-direction:column;align-items:center}
.cs-crest{width:24mm;height:24mm;display:block}
.cs-sch{font:6.4mm/1.1 SJSTitle,Georgia,serif;letter-spacing:.14em;color:var(--cf);margin-top:2mm;text-transform:uppercase}
.cs-adr{font:2.9mm/1.3 SJSText,Georgia,serif;color:#5a4f43;margin-top:.8mm;letter-spacing:.04em}
.cs-mid{display:flex;flex-direction:column;align-items:center;width:100%}
.cs-title{font:18mm/1 SJSTitle,Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#211c17;margin-right:-.16em}
.cs-sub{display:flex;align-items:center;gap:4mm;font:4.6mm/1 SJSCaps,Georgia,serif;letter-spacing:.42em;text-transform:uppercase;color:var(--cg);margin-top:2.2mm}
.cs-sub i{display:block;width:26mm;height:.35mm;background:linear-gradient(90deg,transparent,var(--cg))}.cs-sub i:last-child{background:linear-gradient(270deg,transparent,var(--cg))}
.cs-pre{font:italic 4.6mm/1.2 SJSText,Georgia,serif;color:#5a4f43;margin-top:7mm}
.cs-name{font-family:SJSName,'Times New Roman',serif;font-style:italic;line-height:1.08;color:var(--cf);margin-top:1.5mm;min-height:16mm;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4mm}
.cs-flour{display:flex;align-items:center;gap:2.5mm;width:150mm;margin-top:.5mm}.cs-flour i{flex:1;height:.3mm;background:var(--cg)}.cs-flour b{width:2.6mm;height:2.6mm;transform:rotate(45deg);border:.35mm solid var(--cg);background:var(--cf)}
.cs-body{font:4.4mm/1.62 SJSText,Georgia,serif;color:#2c251e;max-width:212mm;margin-top:5mm}
.cs-body b{font-weight:normal;font-style:italic;color:var(--cf)}
.cs-foot{display:grid;grid-template-columns:1fr 42mm 1fr;align-items:end;width:100%;gap:10mm}
.cs-sig{display:flex;flex-direction:column;align-items:center;font-family:SJSText,Georgia,serif}
.cs-line{width:62mm;height:.3mm;background:#3a3027;margin-bottom:1.6mm}
.cs-sig b{font:3.4mm/1.2 SJSCaps,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;font-weight:normal;color:#211c17}
.cs-sig span{font:italic 3mm/1.3 SJSText,Georgia,serif;color:#5a4f43;margin-top:.6mm}
.cs-sealbox{display:flex;justify-content:center;margin-bottom:-7mm}.cs-seal{width:38mm;height:47.5mm;display:block;filter:drop-shadow(0 .6mm .5mm #0003)}
.cs.white,.cs.white .cs-f1{background-color:#fff}.cs.white .cs-f2{background:#fff}
.cs-field{position:absolute;inset:0;width:100%;height:100%;opacity:.24}
.cs-emb{position:absolute;width:92mm;height:92mm;left:50%;top:50%;transform:translate(-50%,-44%);opacity:.10}
.cs-logo{height:24mm;max-width:48mm;object-fit:contain;display:block}
.cs.three .cs-foot{grid-template-columns:repeat(3,1fr)}.cs.three .cs-line{width:54mm}

const LIVE_KEY='sjs_sports_live';
/* ---------- user control: the same Admin Gmail as isAdmin() in the Firebase rules ---------- */
const SP_ADMINS=['ramalengman@gmail.com'];
const ROLE_L={admin:'Admin',incharge:'Sports In-charge',scorer:'Result recorder',teacher:'Teacher · results',viewer:'View only'};
const RULES_TXT=`    // ===== SJS Sports App (Annual Sports Meet) — user control =====
    // Admin (isAdmin above) : everything, gives every role.
    // Sports In-charge      : everything in the Sports app; adds or removes Result recorders.
    // Result recorder       : enters results only (not after results are locked).
    // Other teachers        : view only, unless "All SJS App teachers can enter results" is on.
    // Roles are given in the Sports app -> Users & roles (stored in sports_roles/{gmail}).
    function spEmail() { return request.auth.token.email.lower(); }
    function spRole() {
      return signedIn() && request.auth.token.email is string
          && exists(/databases/$(database)/documents/sports_roles/$(spEmail()))
        ? get(/databases/$(database)/documents/sports_roles/$(spEmail())).data.role : 'none';
    }
    function spManager() { return isAdmin() || spRole() == 'incharge'; }
    function spRecorder() {
      return spRole() == 'scorer'
        || (isStaff() && get(/databases/$(database)/documents/sports/main).data.get('app', {}).get('teachersScore', false) == true);
    }
    function spOpen(sid) {
      return get(/databases/$(database)/documents/sports/main/s/$(sid)).data.get('locked', false) != true;

const QP_GUESS=(g,n)=>{const L=n.toLowerCase();if(g==='Athletics')return[n,/relay/.test(L)?'Relay':'Individual',/jump|throw|put|vault/.test(L)?'dist':'time'];if(g==='Games')return[n,/chess|badminton|tennis|carrom/.test(L)?'Individual':'Major Game','none'];if(g==='Fun events')return[n,'Minor / Fun','none'];if(g==='Cultural & literary')return[n,/group|quiz|choir|skit|drama|chorus|team|mime/.test(L)?'Cultural – Group':'Cultural / Literary','none','Mixed'];if(/dance|song|sing|elocution|debate|speech|recitation|quiz|drawing|painting|essay|poem|poetry|story|skit|drama|craft|rangoli|choir|mime|fancy dress|handwriting|poster/.test(L))return[n,/group|quiz|choir|skit|drama|team|mime/.test(L)?'Cultural – Group':'Cultural / Literary','none','Mixed'];if(/football|volleyball|basketball|cricket|kabaddi|kho|tug|hockey|throwball/.test(L))return[n,'Major Game','none'];return[n,'Individual','none']};
function qpList(){const hide=new Set(DB.app.qpHide||[]),add=DB.app.qp||{};const out={};Object.entries(PRESETS).forEach(([g,l])=>{out[g]=l.filter(x=>!hide.has(g+'|'+x[0])).concat(add[g]||[])});Object.keys(add).forEach(g=>{if(!out[g])out[g]=add[g].slice()});return out}
function ensureType(name){const s=S();let t=s.types.find(x=>x.name===name);if(!t){const d=RULEDEF[name]||[5,3,1,true,false];t={id:uid(),name,pts:d.slice(0,3),indiv:d[3],team:d[4]};s.types.push(t)}return t}

function blankRec(){return{val:'',holder:'',house:'',year:''}}
function stdEvents(s){
 const cid=n=>(s.cats.find(c=>c.name===n)||{}).id||'';
 const tid=n=>(s.types.find(t=>t.name===n)||s.types[0]).id;
 const L={'Minor':[['50m Race','Individual','time'],['Frog Race','Minor / Fun','none'],['Lemon & Spoon Race','Minor / Fun','none']],
  'Sub-Junior':[['100m Race','Individual','time'],['Long Jump','Individual','dist'],['Sack Race','Minor / Fun','none'],['4x50m Relay','Relay','time']],
  'Junior':[['100m Race','Individual','time'],['200m Race','Individual','time'],['Long Jump','Individual','dist'],['High Jump','Individual','dist'],['Shot Put','Individual','dist'],['4x100m Relay','Relay','time']],
  'Senior':[['100m Race','Individual','time'],['200m Race','Individual','time'],['400m Race','Individual','time'],['800m Race','Individual','time'],['Long Jump','Individual','dist'],['High Jump','Individual','dist'],['Shot Put','Individual','dist'],['Discus Throw','Individual','dist'],['Javelin Throw','Individual','dist'],['4x100m Relay','Relay','time']]};
 for(const [cn,list] of Object.entries(L))for(const g of ['Boys','Girls'])for(const [name,tn,measure] of list)s.events.push({id:uid(),name,catId:cid(cn),gender:g,typeId:tid(tn),measure,rec:blankRec()});
 [['Football','Boys'],['Volleyball','Girls'],['Tug of War','Boys'],['Tug of War','Girls']].forEach(([name,g])=>s.events.push({id:uid(),name,catId:'',gender:g,typeId:tid('Major Game'),measure:'none',rec:blankRec()}));
}
function demo(s){
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const BF=['Lalremruata','Vanlalhriata','Zothanmawia','Lalrinfela','Malsawmtluanga','Lalthlamuana','Rohmingthanga','Lalbiakzuala','Vanlalruata','Lalnunsanga','Samuel','Joseph','Lalhruaitluanga','Zoramsanga','Lalmuanpuia','Ramdinthara'];
 const GF=['Lalrinpuii','Zothanpuii','Vanlalhruaii','Lalremsiami','Malsawmkimi','Lalthlamuani','Rosangpuii','Lalnunmawii','Esther','Lalhmingsangi','Ruth','Zonunsiami','Lalchhanhimi','Vanlalrinchhani','Lalruatfeli','Laldinpuii'];
 const SUR=['Ralte','Darlong','Sailo','Pachuau','Khiangte','Hmar','Chhangte','Fanai'];
 const CLS=[['I','II'],['IV','V'],['VII','VIII'],['X','XI']];
 let bi=0,gi=0;
 s.cats.forEach((c,ci)=>s.houses.forEach(h=>['B','G'].forEach(g=>{for(let k=0;k<2;k++){const i=g==='B'?bi++:gi++;const f=(g==='B'?BF:GF)[i%16];s.athletes.push({id:uid(),name:f+' '+SUR[(i+Math.floor(i/16)*3)%8],cls:(CLS[ci]||['',''])[k],gender:g,houseId:h.id,catId:c.id,chest:String(101+s.athletes.length)})}})));
 const base=n=>{n=n.toLowerCase();return /4x50/.test(n)?36:/4x100/.test(n)?60:/800m/.test(n)?165:/400m/.test(n)?68:/200m/.test(n)?29:/100m/.test(n)?13.8:/50m/.test(n)?8.6:/long/.test(n)?4.1:/high/.test(n)?1.28:/shot/.test(n)?7.6:/discus/.test(n)?21:/javelin/.test(n)?25:0};
 const cf=[1.25,1.15,1.06,1];
 const N=s.events.length;let at=Date.now()-N*90000;
 s.events.forEach((e,ei)=>{
  const t=s.types.find(x=>x.id===e.typeId);const ci=s.cats.findIndex(c=>c.id===e.catId);
  const b=base(e.name),gf=e.gender==='Girls'?1.1:1,f=ci<0?1:cf[ci];
  const mk=()=>e.measure==='time'?b*f*gf:b/f/(gf===1?1:1.18);
  if(b&&rnd()<.55)e.rec={val:fmtPerf(e.measure==='time'?mk()*0.985:mk()*1.02,e.measure),holder:'Previous record',house:s.houses[Math.floor(rnd()*4)].name,year:'2025-26'};
  if(rnd()>.62)return;
  let rows;
  if(t&&t.team){rows=shuf(s.houses).slice(0,t.pts.length).map((h,i)=>({pos:i+1,houseId:h.id,name:'',athId:'',perf:''}))}
  else{const g=e.gender==='Boys'?'B':'G';const pool=shuf(s.athletes.filter(a=>a.catId===e.catId&&a.gender===g)).slice(0,(t?t.pts.length:3));
   let ps=pool.map(()=>mk()*(1+rnd()*.1-.03));ps.sort((a,b)=>e.measure==='dist'?b-a:a-b);
   rows=pool.map((a,i)=>({pos:i+1,houseId:a.houseId,name:a.name,athId:a.id,perf:e.measure==='none'?'':fmtPerf(ps[i],e.measure)}))}
  if(t&&t.team&&e.measure==='time'){let ps=rows.map(()=>mk()*(1+rnd()*.08));ps.sort((a,b)=>a-b);rows.forEach((r,i)=>r.perf=fmtPerf(ps[i],'time'))}
  s.results[e.id]={rows,at:at+=90000};
 });
 const hs=s.houses;s.bonus=[{id:uid(),houseId:hs[2].id,pts:10,reason:'March Past – 1st'},{id:uid(),houseId:hs[0].id,pts:7,reason:'March Past – 2nd'},{id:uid(),houseId:hs[3].id,pts:5,reason:'March Past – 3rd'},{id:uid(),houseId:hs[1].id,pts:-2,reason:'Discipline penalty'}];
 s.demo=true;
}

function parsePerf(v){v=String(v||'').trim().replace(/[a-z\s]+$/i,'');if(!v)return NaN;if(v.includes(':')){const [m,sec]=v.split(':');return (+m)*60+(+sec)}return parseFloat(v)}

/* ---------- the scoring engine ---------- */
function calc(s=S()){
 const M={};s.houses.forEach(h=>M[h.id]={h,total:0,g:0,si:0,b:0,cat:{},type:{},bonus:0,ev:0});
 let done=0,awarded=0;const recs=[],feed=[],cats={},all={};
 const add=(m,key,o0,p,pos,e)=>{const o=m[key]||(m[key]={...o0,pts:0,g:0,s:0,b:0,ev:[]});o.pts+=p;if(pos==1)o.g++;else if(pos==2)o.s++;else if(pos==3)o.b++;o.ev.push(e.name+(e.catId?'':' (Open)')+' – '+ord(pos))};
 s.events.forEach(e=>{
  const r=s.results[e.id];if(!r||!r.rows||!r.rows.length)return;
  const t=Ts(e.typeId,s)||{pts:[],indiv:false,team:false};done++;feed.push({e,r});
  r.rows.forEach(row=>{
   const p=+t.pts[row.pos-1]||0;const x=M[row.houseId];if(!x)return;
   x.total+=p;awarded+=p;x.ev+=p?1:0;if(row.pos==1)x.g++;else if(row.pos==2)x.si++;else if(row.pos==3)x.b++;
   const ck=e.catId||'_open';x.cat[ck]=(x.cat[ck]||0)+p;x.type[t.id]=(x.type[t.id]||0)+p;
   if(t.indiv&&!t.team&&row.name&&String(row.name).trim()){
    const a=row.athId&&s.athletes.find(z=>z.id===row.athId);
    const gender=a&&a.gender?a.gender:(e.gender==='Boys'?'B':e.gender==='Girls'?'G':'');
    const key=a?a.id:norm(row.name)+'|'+row.houseId;
    const o0={key,name:a?a.name:String(row.name).trim(),houseId:a?a.houseId:row.houseId,gender,cls:a?a.cls:''};
    add(cats[ck]||(cats[ck]={}),key,o0,p,row.pos,e);add(all,key,o0,p,row.pos,e);
   }
  });
  if(e.measure!=='none'){const w=r.rows.filter(x=>x.pos==1&&!isNaN(parsePerf(x.perf)))[0];
   if(w){const v=parsePerf(w.perf),rv=parsePerf(e.rec&&e.rec.val);if(isNaN(rv)||better(v,rv,e.measure))recs.push({e,row:w,v,old:e.rec,isNew:!isNaN(rv)||!(e.rec&&e.rec.val)})}}
 });
 s.bonus.forEach(b=>{const x=M[b.houseId];if(x){const v=+b.pts||0;x.total+=v;x.bonus+=v}});
 const st=Object.values(M).sort((a,b)=>b.total-a.total||b.g-a.g||b.si-a.si||b.b-a.b);
 st.forEach((x,i)=>{const p=st[i-1];x.rank=p&&p.total===x.total&&p.g===x.g&&p.si===x.si&&p.b===x.b?p.rank:i+1});
 feed.sort((a,b)=>(b.r.at||0)-(a.r.at||0));
 return{M,st,done,total:s.events.length,awarded,recs,feed,cats,all};
}

/* tiny QR encoder: byte mode, error level M, versions 1-10, mask chosen by penalty */
const QR=(()=>{const ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
 const EXP=new Array(512),LOG=new Array(256);let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
 const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
 const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
 const rsRem=(data,div)=>{const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
 const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
 const alignPos=v=>{if(v===1)return[];const n=Math.floor(v/7)+2,size=v*4+17;const step=Math.ceil((v*4+4)/(n*2-2))*2;const r=[6];for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r};
 function encode(text){const bytes=[...new TextEncoder().encode(text)];let v=1;for(;v<=10;v++)if(bytes.length+2+(v>=10?1:0)<=dataCw(v))break;if(v>10)throw new Error('too long');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);for(let p=0xec;bits.length<cap;p^=0xec^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
  const nb=BLK[v],ec=ECC[v],rawCw=Math.floor(raw(v)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);const div=rsDiv(ec);const blocks=[];
  for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+shortLen-ec+(i<nShort?0:1));k+=d.length;const e=rsRem(d,div);if(i<nShort)d.push(0);blocks.push(d.concat(e))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ec||j>=nShort)all.push(b[i])});
  const size=v*4+17;const M=[...Array(size)].map(()=>new Array(size).fill(false)),F=[...Array(size)].map(()=>new Array(size).fill(false));
  const set=(c,r,d)=>{M[r][c]=d;F[r][c]=true};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  const ap=alignPos(v);ap.forEach((a,i)=>ap.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!==0;
   for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
   for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
  if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1f25);const b=(v<<12)|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bt);set(c,a,bt)}}
  fmt(0);
  let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const xx=right-j,up=((right+1)&2)===0,yy=up?size-1-vert:vert;if(!F[yy][xx]&&i<all.length*8){M[yy][xx]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
  const mk=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&mk[m](x,y))M[y][x]=!M[y][x]};
  const pen=()=>{let p=0;const line=get=>{let run=1,prev=get(0);for(let k=1;k<size;k++){const c=get(k);if(c===prev){run++;if(run===5)p+=3;else if(run>5)p++}else{run=1;prev=c}}};
   for(let y=0;y<size;y++)line(k=>M[y][k]);for(let x=0;x<size;x++)line(k=>M[k][x]);
   for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
   let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;return p};
  let best=0,bp=1e9;for(let m=0;m<8;m++){apply(m);fmt(m);const q=pen();if(q<bp){bp=q;best=m}apply(m)}apply(best);fmt(best);return M}
 function svg(text,px){const M=encode(text),n=M.length,q=4,s=n+q*2;let d='';M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${px||200}" height="${px||200}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
 return{encode,svg}})();

const ANN_KEY='sjs_sports_ann';

function callText(e){const s=S();const by=partsByHouse(e);const hs=s.houses.filter(h=>by[h.id]);return`Calling all participants of ${e.name}, ${e.gender}, ${catName(e.catId)}${e.venue?'. Please report to '+e.venue:''}. `+hs.map(h=>`${h.name} House: ${by[h.id].map(a=>a.name).join(', ')}.`).join(' ')}
function winText(e,r){const w=r.rows.slice().sort((a,b)=>a.pos-b.pos).slice(0,3);return`Result of ${e.name}, ${e.gender}, ${catName(e.catId)}. `+w.map(x=>`${POSW[x.pos]||ord(x.pos)}: ${x.name?x.name+' of ':''}${(Hs(x.houseId)||{}).name||''} House.`).join(' ')}
function pAnnounce(){const s=S(),c=calc();const A=annGet();const days=s.days||[];const today=new Date().toISOString().slice(0,10);
 if(ui.annDay==null){const has=d=>s.events.some(e=>e.dayId===d.id&&!hasRes(e));const td=days.find(d=>d.date===today&&has(d));ui.annDay=(td||days.find(has)||{}).id||''}
 const pend=s.events.filter(e=>!hasRes(e)&&(!ui.annDay||e.dayId===ui.annDay)).sort(schedCmp(s));const next=pend.filter(e=>!A.called.includes(e.id)).slice(0,3);const called=pend.filter(e=>A.called.includes(e.id)).slice(-3).reverse();
 const toTell=c.feed.filter(({e})=>!A.told.includes(e.id)).slice(0,4);
 const parts=e=>{const by=partsByHouse(e);const hs=s.houses.filter(h=>by[h.id]);return hs.length?hs.map(h=>`<div class="annh"><span class="fxteam" style="--hc:${h.color};--ht:${txtOn(h.color)}">${esc(h.name)}</span><span>${by[h.id].map(a=>`${a.chest?`<b>#${esc(a.chest)}</b> `:''}${esc(a.name)}`).join(' · ')}</span></div>`).join(''):'<span class="tiny">No participants entered yet</span>'};
 return`<h2>Announcer — Now &amp; Next</h2><p class="lead">For the person on the microphone: who to call next, and which winners to announce. Tap 🔊 to let the phone read it aloud.</p>

/* ---------- Match fixtures for team games: knock-out, league, or league + final ---------- */
const FXF={knockout:'Knock-out',league:'League (round robin)',leaguefinal:'League + Final'};
function fxOf(eid){const r=S().results[eid];return r&&r.fx||null}
function fxSetDoc(eid,fx){const s=S();let r=s.results[eid];if(!r)r=s.results[eid]={rows:[],at:Date.now(),by:whoAmI()};if(fx)r.fx=fx;else delete r.fx}
const bracketOrder=n=>{let o=[1];while(o.length<n){const m=o.length*2;o=o.flatMap(x=>[x,m+1-x])}return o};
const koRoundName=(left)=>left===2?'Final':left===4?'Semi-final':left===8?'Quarter-final':'Round of '+left;
function fxGen(format,teams,opt){const M=[];const id=()=>uid();const n=teams.length;
 if(format==='knockout'){const size=Math.max(2,2**Math.ceil(Math.log2(Math.max(2,n))));const R=Math.log2(size);const ord=bracketOrder(size);let prev=[];
  for(let r=0;r<R;r++){const cnt=size/2**(r+1);const left=size/2**r;const cur=[];
   for(let k=0;k<cnt;k++){const m={id:id(),stage:'ko',round:koRoundName(left)+(cnt>1?' '+(k+1):''),r,a:'',b:'',sa:'',sb:'',w:''};
    if(r===0){m.a=teams[ord[2*k]-1]||'';m.b=teams[ord[2*k+1]-1]||'';if(!m.a||!m.b){m.bye=true}}else{m.srcA={m:prev[2*k].id,take:'W'};m.srcB={m:prev[2*k+1].id,take:'W'}}
    cur.push(m);M.push(m)}
   if(r===R-2&&opt.third&&cnt===2)var semis=cur;prev=cur}
  if(typeof semis!=='undefined'&&semis&&opt.third&&n>=4)M.push({id:id(),stage:'third',round:'Third place',r:R,a:'',b:'',sa:'',sb:'',w:'',srcA:{m:semis[0].id,take:'L'},srcB:{m:semis[1].id,take:'L'}})}
 else{const L=teams.slice();if(L.length%2)L.push('');const k=L.length;const rounds=k-1;

const PLAN0={start:'09:00',end:'15:30',lunch:'12:30',lunchMin:45,ath:'spread',games:'spread',cult:'spread',scope:'unsched',venues:true,dur:{}};
const planCfg=()=>{const p=S().plan||{};return Object.assign({},PLAN0,p,{dur:Object.assign({},p.dur||{})})};
function typeDur(t){const n=String(t&&t.name||'').toLowerCase();return /major|game/.test(n)?40:/relay/.test(n)?15:/group/.test(n)?20:/cultur|literar/.test(n)?15:10}

 if(/football|soccer/.test(n))return'Football ground';if(/volley/.test(n))return'Volleyball court';if(/basket/.test(n))return'Basketball court';if(/badminton/.test(n))return'Badminton court';

 if(/relay|race|run|hurdle|walk|sprint|\d+ ?m\b|metre|meter|sack|frog|spoon|legged|cycle|obstacle|hopping/.test(n))return'Track';return'Main field'}
const hhmm=t=>String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function autoPlan(P){const s=S();const days=s.days||[];const E=s.entries||{};const g=restGap(s);const dIds=days.map(d=>d.id);
 const done=e=>hasRes(e);const keepDay=e=>done(e)||e.pin||(P.scope==='unsched'&&e.dayId&&dayById(e.dayId));
 const ven=e=>e.venue||(P.venues?guessVenue(e):'Main field');
 const load={};dIds.forEach(d=>load[d]={});const add=(d,v,m)=>{load[d][v]=(load[d][v]||0)+m};
 s.events.filter(e=>keepDay(e)&&load[e.dayId]).forEach(e=>add(e.dayId,ven(e),durOf(e,P)));
 const move=s.events.filter(e=>!keepDay(e));const units={};
 move.forEach(e=>{const gr=evGroup(e);const k=gr==='ath'&&P.ath==='cat'?'cat|'+(e.catId||''):gr+'|'+norm(e.name)+'|'+(e.catId||'');(units[k]=units[k]||[]).push(e)});

 const newDay={};const U=Object.values(units).map(u=>({u,m:u.reduce((n,e)=>n+durOf(e,P),0)})).sort((a,b)=>b.m-a.m);
 U.forEach(({u,m})=>{const byV={};u.forEach(e=>{const v=ven(e);byV[v]=(byV[v]||0)+durOf(e,P)});let best=null,bs=1e18;
  allowed(evGroup(u[0])).forEach(d=>{const L=load[d];const peak=Math.max(0,...Object.entries(byV).map(([v,x])=>(L[v]||0)+x));const tot=Object.values(L).reduce((a,b)=>a+b,0)+m;const sc=peak*1e5+tot;if(sc<bs){bs=sc;best=d}});

 s.events.forEach(e=>{if(timed(e))occ(e.dayId,e,hm(e.time),hm(e.time)+durOf(e,P),ven(e))});
 const todo=s.events.filter(e=>!done(e)&&!timed(e)&&(newDay[e.id]||(e.dayId&&R[e.dayId])));
 const ci={};s.cats.forEach((c,i)=>ci[c.id]=i);const gr={ath:0,games:1,cult:2};
 todo.sort((a,b)=>gr[evGroup(a)]-gr[evGroup(b)]||(/relay/i.test(a.name)-/relay/i.test(b.name))||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})||(ci[a.catId]??99)-(ci[b.catId]??99)||String(a.gender).localeCompare(String(b.gender)));
 const out=[];let late=0;
 todo.forEach(e=>{const d=newDay[e.id]||e.dayId;const r=R[d];const v=ven(e);const du=durOf(e,P);const ps=E[e.id]||[];const ts=orgNames(e.org).map(norm);let t=st,guard=0;

function planSummary(s=S()){const P=planCfg();return(s.days||[]).map(d=>{const l=s.events.filter(e=>e.dayId===d.id&&hm(e.time)!==null);if(!l.length)return`${esc(d.name)}: ${s.events.filter(e=>e.dayId===d.id).length} events`;

 if(kind==='field')return fieldReport(cat,head,sign,foot,sw);
 if(kind==='log')return logReport(head,sign,foot);

function checkResult(e,rows){const s=S(),t=Ts(e.typeId)||{},w=[];const E=(s.entries||{})[e.id]||[];
 const ids=rows.map(r=>r.athId||norm(r.name)+'|'+r.houseId).filter(k=>k&&!k.startsWith('|'));if(new Set(ids).size<ids.length)w.push('The same student is in more than one place.');
 if(t.team){const hs=rows.map(r=>r.houseId);if(new Set(hs).size<hs.length)w.push('The same house is in more than one place.')}
 rows.forEach(r=>{const before=rows.filter(x=>x.pos<r.pos).length;if(r.pos!==before+1)w.push(`Position ${ord(r.pos)} does not follow on (expected ${ord(before+1)}). Ties are fine: 1st, 1st, 3rd.`)});
 if(!t.team&&E.length)rows.forEach(r=>{if(r.athId&&!E.includes(r.athId))w.push(`${r.name} was not entered in this event.`)});
 rows.forEach(r=>{const a=r.athId&&s.athletes.find(z=>z.id===r.athId);if(a&&(e.gender==='Boys'&&a.gender==='G'||e.gender==='Girls'&&a.gender==='B'))w.push(`${a.name} is a ${a.gender==='G'?'girl':'boy'} — this is a ${e.gender} event.`);if(a&&e.catId&&a.catId&&a.catId!==e.catId)w.push(`${a.name} is in ${catName(a.catId)} — this is a ${catName(e.catId)} event.`);if(a&&a.houseId&&a.houseId!==r.houseId)w.push(`${a.name} belongs to ${(Hs(a.houseId)||{}).name} House, not ${(Hs(r.houseId)||{}).name}.`)});
 if(e.measure!=='none'){const bad=rows.filter(r=>r.perf&&isNaN(parsePerf(r.perf)));bad.forEach(r=>w.push(`“${r.perf}” is not a valid ${e.measure==='time'?'time':'mark'}.`));
  const ok=rows.filter(r=>!isNaN(parsePerf(r.perf))).sort((a,b)=>a.pos-b.pos);for(let i=1;i<ok.length;i++){const a=parsePerf(ok[i-1].perf),b=parsePerf(ok[i].perf);if(ok[i].pos>ok[i-1].pos&&(e.measure==='time'?b<a:b>a)){w.push(`${ord(ok[i].pos)} place has a ${e.measure==='time'?'faster time':'better mark'} than ${ord(ok[i-1].pos)} — check the order.`);break}}}

function maxPer(s=S()){return +s.maxPerStudent||0}
/* ---------- participant clash check: a student's events on the same day must be restGap minutes apart ---------- */
const hm=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const restGap=(s=S())=>Math.max(0,parseInt(s.restGap??20)||0);
function clashList(day,s=S()){const E=s.entries||{};const g=restGap(s);const by={};
 s.events.forEach(e=>{if(!e.dayId||!dayById(e.dayId)||(day&&day!=='_none'&&e.dayId!==day))return;const tm=hm(e.time);if(tm===null)return;(E[e.id]||[]).forEach(id=>(by[id]=by[id]||[]).push([e,tm]))});
 const out=[];Object.entries(by).forEach(([id,l])=>{if(l.length<2)return;const a=s.athletes.find(z=>z.id===id);if(!a)return;
  for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const[x,tx]=l[i],[y,ty]=l[j];if(x.dayId!==y.dayId)continue;const d=Math.abs(tx-ty);if(d<Math.max(g,1)||d===0){const[e1,e2]=tx<=ty?[x,y]:[y,x];out.push({a,e1,e2,mins:d})}}});
 return out.sort((p,q)=>(hm(p.e1.time)-hm(q.e1.time))||norm(p.a.name).localeCompare(norm(q.a.name)))}
function clashCount(s=S()){return clashList('',s).length}
/* re-order one day so students get rest between events, then fill times */
function planArrange(day,start,mins,s=S()){const E=s.entries||{};const L=dayEvents(day,s);const g=Math.max(1,restGap(s));const need=Math.ceil(g/mins);
 const set=e=>new Set(E[e.id]||[]);const S2=new Map(L.map(e=>[e.id,set(e)]));const share=(a,b)=>{const x=S2.get(a.id),y=S2.get(b.id);if(!x.size||!y.size)return 0;let n=0;x.forEach(v=>{if(y.has(v))n++});return n};
 let best=null;const tries=[L.slice(),L.slice().reverse(),L.slice().sort((a,b)=>S2.get(b.id).size-S2.get(a.id).size)];
 for(const base of tries){const rem=base.slice(),out=[];let bad=0;
  while(rem.length){const recent=out.slice(-Math.max(0,need-1));let pick=-1,pc=1e9;
   for(let i=0;i<rem.length;i++){const c=recent.reduce((n,r)=>n+share(r,rem[i]),0);if(c===0){pick=i;pc=0;break}if(c<pc){pc=c;pick=i}}
   bad+=pc;out.push(rem.splice(pick,1)[0])}
  if(!best||bad<best.bad)best={order:out,bad}}
 const[h,m]=String(start||'09:00').split(':').map(Number);let tm=h*60+m;
 const plan=best.order.map((e,i)=>{const time=String(Math.floor(tm/60)%24).padStart(2,'0')+':'+String(tm%60).padStart(2,'0');tm+=mins;return{e,ord:i,time}});return plan}
function studentWarn(aid,s=S()){const E=s.entries||{};const evs=s.events.filter(e=>(E[e.id]||[]).includes(aid));const w=[];
 const ind=evs.filter(e=>!(Ts(e.typeId,s)||{}).team).length;if(maxPer(s)&&ind>maxPer(s))w.push(`${ind} individual events (limit ${maxPer(s)})`);
 const g=restGap(s);for(let i=0;i<evs.length;i++)for(let j=i+1;j<evs.length;j++){const a=evs[i],b=evs[j];const ta=hm(a.time),tb=hm(b.time);if(a.dayId&&a.dayId===b.dayId&&ta!==null&&tb!==null){const d=Math.abs(ta-tb);if(d===0)w.push(`time clash: ${a.name} and ${b.name} both at ${fmtTime(a.time)}`);else if(d<g)w.push(`only ${d} min between ${a.name} (${fmtTime(a.time)}) and ${b.name} (${fmtTime(b.time)})`)}}
 return w}
function entryProblems(s=S()){const E=s.entries||{};const seen=new Set(),out=[];Object.values(E).forEach(l=>l.forEach(id=>{if(seen.has(id))return;seen.add(id);const w=studentWarn(id,s);if(w.length){const a=s.athletes.find(z=>z.id===id);if(a)out.push({a,w})}}));return out}

function planSjs(classes,lists){const s=S();const all=lists.flat();
